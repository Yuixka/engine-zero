name: Engine Zero regression and handoff checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mechanism regression suite
        run: node test.js
      - name: Independent geometry and corruption tests
        run: node experiments/test-geometry-audit.js
      - name: Reproducible held-out benchmark regression
        run: node experiments/test-benchmark.js
      - name: Parametric graph connector regression
        run: node components/test-parametric.js
      - name: Nominal revolute interface compatibility regression
        run: node components/test-interfaces.js
      - name: Planar interference risk regression
        run: node experiments/test-planar-interference.js
      - name: Benchmark objective independence regression
        run: node experiments/test-objective-integrity.js
      - name: Generate and verify cross-briefing
        run: |
          node scripts/handoff.js
          node scripts/test-handoff.js
