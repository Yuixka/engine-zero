name: Engine Zero regression and handoff checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mechanism regression suite
        run: node test.js
      - name: Reproducible held-out benchmark regression
        run: node experiments/test-benchmark.js
      - name: Multi-seed audit regression
        run: node experiments/test-multiseed-audit.js
      - name: Generate and verify cross-briefing
        run: |
          node scripts/handoff.js
          node scripts/test-handoff.js
