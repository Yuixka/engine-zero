name: Build and test actual 3D CAD solids
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  cad-solid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real CAD kernel
        run: python -m pip install 'cadquery==2.8.0'
      - name: Derive parts from mechanism graph
        run: node cad/export_sample.js cad/sample_parts.json
      - name: Generate STEP and STL solids
        run: python cad/build_3d.py cad/sample_parts.json --output cad/generated
      - name: Validate CAD geometries and STEP round-trip
        run: python -m unittest discover -s cad -p 'test_*.py' -v
      - name: Publish three sample solids
        uses: actions/upload-artifact@v4
        with:
          name: engine-zero-3d-cad-sample
          path: cad/generated/
          if-no-files-found: error
